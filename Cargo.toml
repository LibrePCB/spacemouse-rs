[package]
name = "spacemouse"
description = "Cross-platform HID Driver for 3Dconnexion SpaceMouse Devices"
keywords = ["space", "mouse", "3d", "3dconnexion"]
categories = ["hardware-support"]
repository = "https://github.com/LibrePCB/spacemouse-rs"
documentation = "https://docs.rs/spacemouse/"
readme = "README.md"
license = "MIT"
version = "0.1.1"
edition = "2021"
rust-version = "1.65"
exclude = ["/.git*", "/.reuse/", "/.rustfmt.toml", "/CONTRIBUTING.md", "/LICENSES/", "/udev/", "*.sh"]

[features]
fail-on-warnings = []

[dependencies]
hidapi = { version = "2", default-features = false, features = ["linux-native-basic-udev"] }
